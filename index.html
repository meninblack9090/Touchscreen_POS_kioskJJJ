<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbf8f2">
  <title>Campus Corner · Touchscreen POS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Embedded base styles also keep this kiosk usable if the CDN is unavailable. */
    :root{--ink:#292b25;--muted:#727569;--paper:#fbf8f2;--orange:#c74720;--line:#e5e3da;--green:#346347}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button,input{font:inherit}button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;min-height:54px;border:0}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,input:focus-visible{outline:3px solid #215a9c;outline-offset:4px}button:not(:disabled):active{transform:scale(.98)}[hidden]{display:none!important}
    .shell{max-width:1440px;margin:auto;padding:0 40px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:25px 0;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:13px}.brand-icon{display:grid;place-items:center;width:48px;height:48px;background:var(--orange);color:white;border-radius:14px;font-size:25px}.brand-name{font-weight:800;font-size:23px;letter-spacing:-1px}.eyebrow{text-transform:uppercase;font-size:12px;letter-spacing:2px;font-weight:750;color:var(--muted)}.top-note{display:flex;align-items:center;gap:9px;font-size:14px;color:var(--muted)}.dot{width:8px;height:8px;background:var(--green);border-radius:50%}
    .progress{display:flex;align-items:center;justify-content:center;gap:28px;margin:28px auto 34px;list-style:none;padding:0}.progress li{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:14px;font-weight:600}.step-number{display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;width:28px;height:28px;font-size:12px;background:#fff}.progress .active{color:var(--orange)}.active .step-number{background:var(--orange);border-color:var(--orange);color:white}.complete .step-number{color:var(--green);background:#e9efe5;border-color:#e9efe5}.progress li+li:before{content:"";width:30px;height:1px;background:var(--line);margin-right:10px}
    main{padding-bottom:36px;min-height:68vh}h1{font-size:clamp(30px,3.3vw,44px);line-height:1.15;letter-spacing:-1.7px;margin:0 0 10px;font-weight:800}h2{font-size:24px;letter-spacing:-.6px;font-weight:750;margin:0}p{margin:0}.muted{color:var(--muted)}.intro{margin-bottom:28px}.section-label{font-size:13px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin-bottom:15px}.selection-layout{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:34px;align-items:start}.products{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.product{background:white;border:1px solid var(--line);padding:12px;border-radius:19px;text-align:left;position:relative;transition:box-shadow .15s,border-color .15s}.product:hover{border-color:#c74720;box-shadow:0 6px 20px #292b2509}.product-art{height:125px;border-radius:12px;display:grid;place-items:center;font-size:67px;margin-bottom:16px}.product-name{font-size:19px;display:block;font-weight:750;margin:0 4px 4px}.product-desc{font-size:13px;color:var(--muted);display:block;margin:0 4px 18px}.product-bottom{display:flex;align-items:center;justify-content:space-between;margin:0 4px 4px;font-size:18px;font-weight:750}.add-icon{display:grid;place-items:center;background:#f7eee5;color:var(--orange);width:36px;height:36px;border-radius:50%;font-size:23px}.panel{background:white;border:1px solid var(--line);border-radius:22px;padding:25px;box-shadow:0 6px 20px #292b2504}.cart-heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.pill{background:#f1f2ec;border-radius:20px;padding:5px 11px;font-size:13px;font-weight:650}.empty{padding:45px 10px;text-align:center;color:var(--muted)}.empty-symbol{font-size:42px;margin-bottom:15px}.empty strong{display:block;color:var(--ink);font-size:19px;margin-bottom:5px}.cart-row{padding:18px 0;border-top:1px solid var(--line)}.row-heading{display:flex;justify-content:space-between;align-items:start;gap:10px}.row-heading strong{font-size:17px}.unit{font-size:13px;color:var(--muted)}.row-controls{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px}.quantity{display:flex;align-items:center;gap:6px}.quantity button{width:52px;height:52px;min-height:52px;background:#f3f3ee;border-radius:12px;font-size:25px}.quantity span{width:34px;text-align:center;font-weight:750}.remove{background:transparent;color:#a03d24;font-size:14px;padding:8px 12px;border-radius:10px}.remove:hover{background:#fff2eb}.cart-total{border-top:1px dashed #c9cbbf;margin-top:12px;padding:22px 0;display:flex;align-items:center;justify-content:space-between;font-weight:700}.cart-total strong{font-size:28px;letter-spacing:-1px}.btn{padding:16px 24px;border-radius:13px;font-weight:750;font-size:17px;display:inline-flex;align-items:center;justify-content:center;gap:16px;min-height:60px;line-height:1.3}.primary{background:var(--orange);color:white}.primary:hover{background:#ad3816}.secondary{background:white;color:var(--ink);border:1px solid #cdd0c4}.secondary:hover{background:#f3f3ed}.wide{width:100%}.cart-caption{text-align:center;font-size:12px;color:var(--muted);margin-top:13px}.catalog-note{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--muted);margin-top:23px}.center-screen{max-width:800px;margin:0 auto}.center-intro{text-align:center;margin:40px 0 28px}.actions{display:flex;justify-content:space-between;gap:16px;margin-top:26px}.actions>*{flex:1}.summary-row{display:grid;grid-template-columns:1fr auto;gap:16px;padding:21px 0;border-bottom:1px solid var(--line)}.summary-row:first-child{padding-top:0}.summary-name{font-size:19px;font-weight:700}.summary-detail{font-size:15px;color:var(--muted);margin-top:4px}.summary-subtotal{font-size:20px;font-weight:750}.amount-box{display:flex;justify-content:space-between;align-items:center;padding:24px;background:#f4f4ed;border-radius:14px;margin-top:22px;gap:12px}.amount-box strong{font-size:32px;letter-spacing:-1px}.methods{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.method{border:1px solid var(--line);border-radius:20px;background:white;text-align:center;padding:35px 16px;min-height:235px}.method:hover{border-color:var(--orange);background:#fffaf5}.method-icon{display:block;font-size:43px;margin-bottom:18px}.method strong{font-size:20px;display:block}.method small{display:block;color:var(--muted);font-size:14px;margin-top:10px}.payment-panel{max-width:530px;margin:auto}.payment-panel .amount-box{margin:0 0 25px}.input-label{display:block;font-weight:700;margin-bottom:10px}.cash-input{border:2px solid #cdd0c4;width:100%;min-height:72px;border-radius:13px;padding:12px 18px;font-size:28px;color:var(--ink);background:white}.cash-input[aria-invalid="true"]{border-color:#b3261e}.cash-help{font-size:14px;color:var(--muted);margin-top:9px}.change-preview{display:flex;justify-content:space-between;margin:20px 0;padding:15px 0;border-bottom:1px solid var(--line)}.error{color:#9d271e;background:#fff0eb;border-radius:12px;padding:14px;margin:17px 0;font-weight:600}.payment-instruction{text-align:center;font-size:18px;margin:22px 0}.demo-note{color:var(--muted);font-size:13px;text-align:center;margin:16px 0}.qr-image{display:block;width:190px;height:190px;margin:20px auto;border:8px solid white;outline:1px solid var(--line);border-radius:8px}.card-terminal{font-size:70px;text-align:center;margin-top:25px}.success-mark{margin:0 auto 22px;display:grid;place-items:center;width:90px;height:90px;border-radius:50%;background:#e4eee3;color:var(--green);font-size:44px}.success-text{color:var(--green)}.details{margin:0}.detail{display:flex;justify-content:space-between;gap:20px;padding:13px 0;border-bottom:1px solid #eff0e9}.detail dt{color:var(--muted)}.detail dd{margin:0;text-align:right;font-weight:700;overflow-wrap:anywhere}.reference{font-family:ui-monospace,Consolas,monospace;font-size:14px}.receipt{max-width:620px;margin:auto;border-radius:8px;padding:34px;position:relative}.receipt-top{text-align:center;border-bottom:1px dashed #c9cbbf;padding-bottom:23px;margin-bottom:23px}.receipt-top h2{font-size:26px}.receipt-meta{font-size:14px;color:var(--muted);margin-top:14px;overflow-wrap:anywhere}.receipt-items{margin:20px 0 0}.receipt .cart-total{margin-top:22px}.receipt-thanks{text-align:center;margin:25px 0 0;font-size:15px;color:var(--muted)}.footer{display:flex;justify-content:space-between;gap:15px;border-top:1px solid var(--line);padding:20px 0;color:var(--muted);font-size:12px}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);padding:15px 24px;border-radius:14px;background:var(--ink);color:white;box-shadow:0 8px 30px #0002;z-index:20;max-width:90vw;text-align:center}.processing{display:flex;align-items:center;justify-content:center;gap:12px;padding:18px;color:var(--green);font-weight:700}.spinner{width:22px;height:22px;border:3px solid #d7e4d4;border-top-color:var(--green);border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:1100px){.shell{padding:0 24px}.selection-layout{grid-template-columns:minmax(0,1fr) 345px;gap:24px}.products{grid-template-columns:repeat(2,minmax(0,1fr))}.progress{gap:14px}.progress li+li:before{width:15px;margin-right:0}.panel{padding:22px}}
    @media(max-width:760px){.shell{padding:0 18px}.topbar{padding:18px 0}.brand-name{font-size:21px}.top-note{display:none}.progress{gap:8px;justify-content:space-between;margin:22px 0 27px}.progress li{font-size:12px;gap:5px}.progress li+li:before{display:none}.step-number{width:25px;height:25px}.selection-layout{grid-template-columns:1fr}.product-art{height:105px;font-size:58px}.product-name{font-size:18px}.product-desc{font-size:12px}.products{gap:12px}.center-intro{margin:26px 0}.methods{grid-template-columns:1fr}.method{min-height:110px;padding:20px;display:grid;grid-template-columns:60px 1fr;text-align:left;align-items:center;column-gap:14px}.method-icon{grid-row:span 2;margin:0}.method small{margin-top:2px}.actions{flex-direction:column}.receipt{padding:24px 20px}.footer{font-size:11px}.detail{gap:12px}.reference{font-size:12px}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand"><div class="brand-icon" aria-hidden="true">✳</div><div><div class="brand-name">TRIPLE J corner<span style="color:var(--orange)">.</span></div><div class="eyebrow">Good food. Campus essentials.</div></div></div>
      <div class="top-note"><span class="dot"></span>Self-service kiosk <span style="padding:0 7px">/</span> Take your time, make it yours.</div>
    </header>
    <ol class="progress" aria-label="Transaction progress" id="progress"></ol>
    <main id="app"></main>
    <footer class="footer"><span>CAMPUS CORNER · FOOD & MERCHANDISE</span><span>Tap. Pay. Enjoy.</span></footer>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script>
  (() => {
    'use strict';
    // Prices and all calculations are integer centavos, never floating-point pesos.
    const products = Object.freeze([
      {id:'coffee',name:'Coffee',price:4500,icon:'☕',color:'#eee5d7',description:'Your daily pick-me-up',category:'Drink'},
      {id:'sandwich',name:'Sandwich',price:5000,icon:'🥪',color:'#edf0dc',description:'A little lunch-time fuel',category:'Food'},
      {id:'soda',name:'Soft Drink',price:3500,icon:'🥤',color:'#f6e1d8',description:'Chilled & refreshing',category:'Drink'},
      {id:'cookies',name:'Cookies',price:2500,icon:'🍪',color:'#f3e7d3',description:'A sweet study companion',category:'Food'},
      {id:'water',name:'Bottled Water',price:2000,icon:'💧',color:'#e0ecec',description:'Stay hydrated, stay focused',category:'Drink'},
      {id:'chocolate',name:'Chocolate',price:2500,icon:'🍫',color:'#ebe0db',description:'For your well-earned break',category:'Food'},
      {id:'notebook',name:'Campus Notebook',price:6500,icon:'📓',color:'#e4e8f0',description:'Big ideas start here',category:'Merchandise'},
      {id:'pen',name:'Ballpoint Pen',price:1500,icon:'🖊️',color:'#eee6ed',description:'Ready for the next lecture',category:'Merchandise'}
    ]);
    const METHODS = ['Cash','QR Payment','Credit/Debit Card'];
    const fresh = () => ({screen:1,cart:new Map(),method:null,cash:'',receipt:null,busy:false,error:'',timer:null});
    let state = fresh(), toastTimer;
    const app = document.getElementById('app');
    const money = cents => '₱' + (cents / 100).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
    const escape = value => String(value).replace(/[&<>"']/g,c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const items = () => products.filter(p => state.cart.has(p.id)).map(p => ({...p,qty:state.cart.get(p.id),subtotal:p.price*state.cart.get(p.id)}));
    const total = () => items().reduce((sum,p) => sum+p.subtotal,0);
    const count = () => items().reduce((sum,p) => sum+p.qty,0);
    const button = (label,action,kind='primary',extra='') => `<button type="button" class="btn ${kind}" data-action="${action}" ${extra}>${label}</button>`;
    const due = () => `<div class="amount-box"><span>Total due</span><strong>${money(total())}</strong></div>`;
    function notify(message){const toast=document.getElementById('toast');clearTimeout(toastTimer);toast.textContent=message;toast.hidden=false;toastTimer=setTimeout(()=>{toast.hidden=true;toast.textContent='';},2400);}
    function summaryRows(list){return list.map(p=>`<div class="summary-row"><div><div class="summary-name">${escape(p.name)}</div><div class="summary-detail">${p.qty} × ${money(p.price)} = ${money(p.subtotal)}</div></div><div class="summary-subtotal">${money(p.subtotal)}</div></div>`).join('');}
    function details(r,includeChange=false){return `<dl class="details"><div class="detail"><dt>Transaction amount</dt><dd>${money(r.total)}</dd></div><div class="detail"><dt>Amount paid</dt><dd>${money(r.paid)}</dd></div><div class="detail"><dt>Payment method</dt><dd>${escape(r.method)}</dd></div>${includeChange?`<div class="detail"><dt>Change</dt><dd>${money(r.change)}</dd></div>`:''}<div class="detail"><dt>Transaction number</dt><dd class="reference">${r.number}</dd></div></dl>`;}
    function selection(){return `<div class="selection-layout"><section><div class="intro"><div class="section-label">A good day starts here</div><h1>What can we get you?</h1><p class="muted">Tap an item to add it to your order.</p></div><div class="products">${products.map(p=>`<button type="button" class="product" data-action="add" data-id="${p.id}" aria-label="Add ${p.name}, ${money(p.price)}"><span class="product-art" style="background:${p.color}" aria-hidden="true">${p.icon}</span><span class="product-name">${p.name}</span><span class="product-desc">${p.description}</span><span class="product-bottom"><span>${money(p.price)}</span><span class="add-icon" aria-hidden="true">+</span></span></button>`).join('')}</div><p class="catalog-note"><span aria-hidden="true">✦</span> A quick bite, a fresh start, or something for class.</p></section><aside class="panel" aria-label="Current order"><div class="cart-heading"><h2>Your order</h2><span class="pill" id="item-count">${count()} ${count()===1?'item':'items'}</span></div><div id="cart-items">${items().length?items().map(p=>`<div class="cart-row" data-cart-id="${p.id}"><div class="row-heading"><div><strong>${p.name}</strong><div class="unit">${money(p.price)} each</div></div><strong>${money(p.subtotal)}</strong></div><div class="row-controls"><div class="quantity"><button type="button" data-action="minus" data-id="${p.id}" aria-label="Decrease ${p.name} quantity">−</button><span aria-label="${p.name} quantity">${p.qty}</span><button type="button" data-action="add" data-id="${p.id}" aria-label="Increase ${p.name} quantity">+</button></div><button type="button" class="remove" data-action="remove" data-id="${p.id}" aria-label="Remove ${p.name}">Remove</button></div></div>`).join(''):`<div class="empty"><div class="empty-symbol" aria-hidden="true">🛍️</div><strong>A little empty in here.</strong><p>Tap something tasty to get started.</p></div>`}</div><div class="cart-total"><span>Total amount</span><strong id="cart-total">${money(total())}</strong></div>${button('Proceed to Order Summary <span aria-hidden="true">→</span>','summary','primary wide',!count()?'disabled':'')}<p class="cart-caption">Review your order before you pay.</p></aside></div>`;}
    function summary(){return `<section class="center-screen"><div class="center-intro"><div class="section-label">Check the good stuff</div><h1>Your order summary</h1><p class="muted">Everything look right? Let’s make it yours.</p></div><div class="panel">${summaryRows(items())}<div class="amount-box"><span>Total amount · ${count()} items</span><strong>${money(total())}</strong></div></div><div class="actions">${button('← Back','selection','secondary')}${button('Continue to Payment →','methods')}</div></section>`;}
    function methods(){return `<section class="center-screen"><div class="center-intro"><div class="section-label">Your order is ready</div><h1>How would you like to pay?</h1><p class="muted">Choose a payment method to continue.</p></div><div class="methods">${METHODS.map((m,i)=>`<button type="button" class="method" data-action="method" data-method="${i}"><span class="method-icon" aria-hidden="true">${['💵','▦','💳'][i]}</span><strong>${m}</strong><small>${['Pay with cash','Scan with your payment app','Tap, insert, or swipe'][i]}</small></button>`).join('')}</div><div class="amount-box"><span>Order total</span><strong>${money(total())}</strong></div><div class="actions">${button('← Back to Order Summary','summary-back','secondary')}</div></section>`;}
    // An embedded image, deliberately labeled as a placeholder; no real payment payload.
    const qrSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150"><rect width="150" height="150" fill="white"/><g fill="#292b25"><path d="M5 5h40v40H5zm100 0h40v40h-40zM5 105h40v40H5z"/><path d="M55 5h10v20H55zm20 0h20v10H75zM55 35h30v10H55zm35-10h10v30H90zM5 55h20v10H5zm30 0h30v20H35zm40 0h10v30H75zm30 0h30v10h-30zm30 20h10v20h-10zM5 75h10v20H5zm20 10h40v10H25zm30 20h20v10H55zm30-10h20v30H85zm30-20h10v40h-10zm20 30h10v20h-10zM55 125h10v20H55zm20 10h20v10H75zm30-10h20v20h-20zm30 10h10v10h-10z"/></g><g fill="white"><path d="M12 12h26v26H12zm100 0h26v26h-26zM12 112h26v26H12z"/></g><g fill="#292b25"><path d="M19 19h12v12H19zm100 0h12v12h-12zM19 119h12v12H19z"/></g></svg>`;
    function payment(){let body='';
      if(state.method==='Cash'){body=`<form id="cash-form" novalidate><label class="input-label" for="cash">Amount Paid</label><input class="cash-input" id="cash" name="amountPaid" type="number" inputmode="decimal" min="0" step="0.01" autocomplete="off" placeholder="0.00" value="${escape(state.cash)}" aria-describedby="cash-help cash-error" aria-invalid="${!!state.error}"><p id="cash-help" class="cash-help">Enter the cash received in pesos.</p><div class="change-preview"><span>Change</span><strong id="change-preview">${previewChange()}</strong></div><div id="cash-error" class="error" role="alert" ${state.error?'':'hidden'}>${escape(state.error)}</div><button class="btn primary wide" type="submit">Pay Now →</button></form>`;}
      if(state.method==='QR Payment'){body=`<img class="qr-image" src="data:image/svg+xml,${encodeURIComponent(qrSvg)}" alt="QR code placeholder for simulated payment"><p class="payment-instruction">Scan the QR code using your supported payment application.</p><p class="demo-note">Demo QR placeholder · No funds are transferred.<br>Tap below to confirm a simulated payment.</p>${button('Confirm Payment →','confirm','primary wide')}`;}
      if(state.method==='Credit/Debit Card'){body=`<div class="card-terminal" aria-hidden="true">💳</div><p class="payment-instruction">Please tap, insert, or swipe your card.</p><p class="demo-note">Simulated card payment · No funds are transferred.</p><div id="processing" class="processing" role="status" aria-live="polite" ${state.busy?'':'hidden'}><span class="spinner" aria-hidden="true"></span>Processing payment...</div>${button('Process Payment →','process','primary wide',state.busy?'disabled':'')}`;}
      return `<section class="center-screen"><div class="center-intro"><div class="section-label">One last step</div><h1>${state.method==='Cash'?'Pay with cash':state.method==='QR Payment'?'Scan to pay':'Pay with your card'}</h1><p class="muted">${state.method}</p></div><div class="panel payment-panel">${due()}${body}</div><div class="actions payment-panel">${button('← Change Payment Method','change-method','secondary wide',state.busy?'disabled':'')}</div></section>`;
    }
    function success(){const r=state.receipt;return `<section class="center-screen" style="max-width:620px"><div class="center-intro"><div class="success-mark" aria-hidden="true">✓</div><div class="section-label success-text">All taken care of</div><h1>Payment successful!</h1><p class="muted">Thank you. Your campus pick-me-up is on its way.</p></div><div class="panel">${details(r)}</div><div class="actions">${button('View Receipt →','receipt','primary wide')}</div></section>`;}
    function receipt(){const r=state.receipt;return `<section class="center-screen"><div class="center-intro"><div class="section-label">Thanks for stopping by</div><h1>Your digital receipt</h1><p class="muted">A little record of a good campus day.</p></div><article class="panel receipt" aria-label="Digital receipt"><div class="receipt-top"><h2>campus corner.</h2><p class="muted">Campus Food & Merchandise Outlet</p><p class="receipt-meta">Transaction No.<br><strong class="reference">${r.number}</strong><br><br>Date: ${escape(new Date(r.date).toLocaleString('en-PH',{dateStyle:'medium',timeStyle:'short'}))}</p></div><div class="section-label">Purchased items</div><div class="receipt-items">${summaryRows(r.items)}</div><div class="cart-total"><span>Total</span><strong>${money(r.total)}</strong></div><dl class="details"><div class="detail"><dt>Payment method</dt><dd>${escape(r.method)}</dd></div><div class="detail"><dt>Amount paid</dt><dd>${money(r.paid)}</dd></div><div class="detail"><dt>Change</dt><dd>${money(r.change)}</dd></div><div class="detail"><dt>Status</dt><dd class="success-text">Payment Successful</dd></div></dl><p class="receipt-thanks">Thanks for supporting your campus store.<br>See you on your next break!</p></article><div class="actions" style="max-width:620px;margin-left:auto;margin-right:auto">${button('New Transaction →','reset','primary wide')}</div></section>`;}
    function render(focusHeading=true){
      if(focusHeading){clearTimeout(toastTimer);const toast=document.getElementById('toast');toast.hidden=true;toast.textContent='';}
      const group=state.screen<=2?state.screen:state.screen<=4?3:4;
      document.getElementById('progress').innerHTML=['Select items','Review order','Payment','Receipt'].map((label,i)=>`<li class="${i+1===group?'active':i+1<group?'complete':''}" ${i+1===group?'aria-current="step"':''}><span class="step-number">${i+1<group?'✓':i+1}</span>${label}</li>`).join('');
      app.innerHTML=[selection,summary,methods,payment,success,receipt][state.screen-1]();
      if(focusHeading){const heading=app.querySelector('h1');heading.tabIndex=-1;heading.focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});}
    }
    // Strict parsing accepts monetary values only, with at most two decimal places.
    function parseCash(raw){
      if(!/^\d+(?:\.\d{1,2})?$/.test(raw.trim())) return null;
      const [whole,fraction='']=raw.trim().split('.');
      const cents=Number(whole)*100+Number(fraction.padEnd(2,'0'));
      return Number.isSafeInteger(cents)&&cents<=99999999900?cents:null;
    }
    function previewChange(){const paid=parseCash(state.cash);return paid!==null&&paid>=total()?money(paid-total()):'—';}
    // Cryptographic randomness plus timestamp protects references across tabs/reloads.
    function transactionNumber(){
      const bytes=new Uint8Array(16);crypto.getRandomValues(bytes);
      const random=Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('').toUpperCase();
      const now=new Date();return `TXN-${now.getFullYear()}-${now.getTime().toString(36).toUpperCase()}-${random}`;
    }
    function finish(paid){
      if(state.screen!==4||state.receipt||!METHODS.includes(state.method)||!count())return;
      const amount=total();
      if(!Number.isSafeInteger(paid)||paid<amount||paid<0)return;
      if(state.method!=='Cash'&&paid!==amount)return;
      const receiptItems=Object.freeze(items().map(p=>Object.freeze({...p})));
      state.receipt=Object.freeze({number:transactionNumber(),date:new Date().toISOString(),items:receiptItems,total:amount,paid,change:paid-amount,method:state.method});
      state.busy=false;state.timer=null;state.error='';state.screen=5;render();
    }
    function navigate(screen){state.screen=screen;state.error='';render();}
    app.addEventListener('click',event=>{
      const target=event.target.closest('button[data-action]');if(!target||target.disabled||state.busy)return;
      const action=target.dataset.action,id=target.dataset.id;
      if(['add','minus','remove'].includes(action)&&state.screen===1){
        const product=products.find(p=>p.id===id);if(!product)return;
        const qty=state.cart.get(id)||0;
        if(action==='add'){
          if(qty>=999){notify('Invalid quantity. Maximum 999 per item.');return;}
          state.cart.set(id,qty+1);notify(`${product.name} added to your order.`);
        }else if(action==='minus'){
          if(qty<=1){state.cart.delete(id);notify(`${product.name} removed from your order.`);}else state.cart.set(id,qty-1);
        }else{state.cart.delete(id);notify(`${product.name} removed from your order.`);}
        render(false);
        // Preserve keyboard focus where possible after the cart updates.
        app.querySelector(`button[data-action="${action}"][data-id="${id}"]`)?.focus({preventScroll:true});
      }else if(action==='summary'&&state.screen===1&&count())navigate(2);
      else if(action==='selection'&&state.screen===2)navigate(1);
      else if(action==='methods'&&state.screen===2&&count())navigate(3);
      else if(action==='summary-back'&&state.screen===3)navigate(2);
      else if(action==='method'&&state.screen===3&&count()){
        const method=METHODS[Number(target.dataset.method)];if(!method)return;
        state.method=method;state.cash='';navigate(4);
      }else if(action==='change-method'&&state.screen===4){state.method=null;state.cash='';navigate(3);}
      else if(action==='confirm'&&state.screen===4&&state.method==='QR Payment')finish(total());
      else if(action==='process'&&state.screen===4&&state.method==='Credit/Debit Card'){
        state.busy=true;render(false);
        state.timer=setTimeout(()=>{if(state.screen===4&&state.busy&&state.method==='Credit/Debit Card')finish(total());},1400);
      }else if(action==='receipt'&&state.screen===5&&state.receipt)navigate(6);
      else if(action==='reset'&&state.screen===6){
        clearTimeout(state.timer);clearTimeout(toastTimer);state=fresh();
        const toast=document.getElementById('toast');toast.hidden=true;toast.textContent='';render();
      }
    });
    app.addEventListener('input',event=>{
      if(event.target.id!=='cash'||state.screen!==4||state.method!=='Cash')return;
      state.cash=event.target.value;state.error='';event.target.setAttribute('aria-invalid','false');
      const error=document.getElementById('cash-error');error.hidden=true;error.textContent='';
      document.getElementById('change-preview').textContent=previewChange();
    });
    app.addEventListener('submit',event=>{
      if(event.target.id!=='cash-form')return;event.preventDefault();
      if(state.screen!==4||state.method!=='Cash'||state.busy||!count())return;
      const input=document.getElementById('cash'),raw=input.value;state.cash=raw;
      const paid=parseCash(raw);
      state.error=input.validity.badInput?'Invalid payment. Enter a valid amount.':!raw.trim()?'Enter the amount paid.':paid===null?'Invalid payment. Enter a non-negative amount with up to 2 decimal places.':paid<total()?`Insufficient payment. Please enter at least ${money(total())}.`:'';
      if(state.error){const error=document.getElementById('cash-error');error.textContent=state.error;error.hidden=false;input.setAttribute('aria-invalid','true');input.focus();return;}
      finish(paid);
    });
    render(false);
  })();
  </script>
</body>
</html>
